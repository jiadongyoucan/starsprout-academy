<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="星芽学堂：面向 2–6 岁家庭的体系化课程、AI 学习计划、创作中心与家园社区。" />
  <title>星芽学堂 · 幼儿园体系化学习</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/theme.css" />
</head>
<body>
  <div class="bg-scene" aria-hidden="true">
    <span class="orb orb-a"></span><span class="orb orb-b"></span><span class="orb orb-c"></span>
    <span class="glyph g1">✦</span><span class="glyph g2">🍃</span><span class="glyph g3">✦</span><span class="glyph g4">🌙</span>
  </div>
  <div id="authRoot" class="auth-root"></div>

  <div id="shell" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/home" aria-label="星芽学堂首页">
        <span class="brand-mark" id="brandMark"></span>
        <span class="brand-text"><strong>星芽学堂</strong><small>每天 20 分钟</small></span>
      </a>
      <nav class="side-nav" id="sideNav" aria-label="主导航"></nav>
      <div id="sidePet" class="side-pet" role="link" tabindex="0" hidden></div>
      <div class="side-foot">
        <div class="side-tip">
          <span>🌱</span>
          <div><strong>慢一点，也是在长大</strong><small>每天一个小活动，连续性比强度更重要。</small></div>
        </div>
        <button class="user-card" id="userMenuBtn" type="button" aria-haspopup="menu">
          <span class="avatar" id="userAvatar">星</span>
          <span class="user-meta"><strong id="userName">…</strong><small id="userRole">家长</small></span>
          <span class="chev">⌄</span>
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" type="button" aria-label="打开菜单">☰</button>
        <div class="page-title">
          <h1 id="pageTitle">首页</h1>
          <p id="pageSubtitle">今天也一起，慢慢长大</p>
        </div>
        <div class="top-actions">
          <label class="child-switcher" id="childSwitcherWrap" hidden>
            <span class="sr-only">选择孩子</span>
            <select id="childSwitcher" aria-label="选择孩子"></select>
          </label>
          <button class="icon-btn" id="bellBtn" type="button" aria-label="提醒">
            <span aria-hidden="true">🔔</span><span class="dot" id="bellDot" hidden></span>
          </button>
          <button class="avatar avatar-btn" id="topAvatar" type="button" aria-label="账号菜单">星</button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="快捷导航"></nav>
  </div>

  <div id="modalRoot" class="modal-root" aria-live="polite"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="menuRoot" class="menu-root" hidden></div>

  <noscript><p style="padding:24px">星芽学堂需要启用 JavaScript 才能使用。</p></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>

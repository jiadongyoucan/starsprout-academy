services:
  starsprout:
    build: .
    container_name: starsprout-academy
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      # 默认不写入演示账号：首次打开会引导创建管理员。
      # 需要完整演示数据时使用：docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      ENABLE_SANDBOX: ${ENABLE_SANDBOX:-false}
      # 可选：接入真实大模型（否则自动使用本地规则引擎，功能完整）
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      # 连接器允许域名（逗号分隔，留空则 HTTP 连接器禁用；内置工具不受影响）
      CONNECTOR_ALLOWED_HOSTS: ${CONNECTOR_ALLOWED_HOSTS:-}
      SNAPSHOT_RETENTION_DAYS: "30"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
